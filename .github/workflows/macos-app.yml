name: macOS App
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, feat/traditional-chinese-macos]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HUB_SKIP_NPM: "1"
      HUB_SKIP_APP: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: npm --prefix hub ci --ignore-scripts
      - name: Verify terminal prebuild
        run: node hub/node_modules/node-pty/scripts/prebuild.js
      - name: Japanese and Traditional Chinese regressions
        run: TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)" npm --prefix hub test
      - name: Build portable Traditional Chinese App
        env:
          HUB_LANG: zh-TW
          HUB_BUNDLE_RUNTIME: "1"
          HUB_NO_DESKTOP_LINK: "1"
          HUB_APP_DIR: ${{ runner.temp }}/ProjectHub-build
        run: bash hub/app/build-app.sh
      - name: Verify and package
        run: |
          APP="$RUNNER_TEMP/ProjectHub-build/Project Hub.app"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Project-Hub-zh-TW-macOS-arm64.zip
          shasum -a 256 Project-Hub-zh-TW-macOS-arm64.zip > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Project-Hub-zh-TW-macOS-arm64
          path: |
            Project-Hub-zh-TW-macOS-arm64.zip
            SHA256SUMS
          retention-days: 30
