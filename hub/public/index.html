<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Hub</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <h1>Project Hub</h1>
  <button class="ver" id="ver" type="button" title="変更の記録を見る"></button>
  <button class="tb upd" id="upd" type="button" hidden></button>
  <span class="sp"></span>
  <button class="tb turn" id="turn" type="button" aria-pressed="false">あなたの番 <span class="n" id="turn-n">0</span></button>
  <button class="tb" id="gear" type="button" aria-pressed="false">設定</button>
</header>

<div class="app">
  <nav class="list" id="list" aria-label="プロジェクトと作業"></nav>
  <main class="main" id="main"></main>
</div>

<div class="menu" id="menu" hidden role="menu"></div>
<div class="toast" id="toast" hidden></div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="app.js"></script>
</body>
</html>
